# A napi futáshoz NEM kell telepítés — a scriptek a repo gyökeréből futnak.
# Ez a fájl a csomagosítás (pip install -e .) és a pytest konfiguráció alapja.

[project]
name = "subtitle-translator"
version = "2.0.0"
description = "SRT feliratfordító pipeline LLM providerekkel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Edit Diószegi" }]
keywords = ["subtitles", "srt", "translation", "llm", "hungarian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Hungarian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "google-genai",
    "python-dotenv",
    "pydantic",
]

[project.urls]
Repository = "https://github.com/dioszedit/subtitle-translator"
Issues = "https://github.com/dioszedit/subtitle-translator/issues"

[project.scripts]
subtr = "subtr.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]   # a PEP 639-es license = "MIT" mezőhöz
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["subtr"]
