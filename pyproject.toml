# A napi futáshoz NEM kell telepítés — a scriptek a repo gyökeréből futnak.
# Ez a fájl a csomagosítás (pip install -e .) és a pytest konfiguráció alapja.

[project]
name = "subtitle-translator"
version = "2.0.0"
description = "SRT feliratfordító pipeline LLM providerekkel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diószegi Edit" }]
dependencies = [
    "google-genai",
    "python-dotenv",
    "pydantic",
]

[project.optional-dependencies]
# Az addons/ mappa scriptjeinek függőségei — a fordítási pipeline nem használja
# őket, ezért nem kötelezők:  pip install -e ".[addons]"
addons = [
    "cloudscraper",     # mdl-init: MyDramaList Cloudflare mögött van
    "beautifulsoup4",   # mdl-init: HTML parse
]

[project.scripts]
subtr = "subtr.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]   # a PEP 639-es license = "MIT" mezőhöz
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["subtr"]
